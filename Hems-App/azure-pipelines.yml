trigger:
  branches:
    include:
      - main   # main branch tetiklendiğinde çalışır

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  serviceName: 'myapp'   # Ubuntu’daki systemd servis adı

steps:
  # .NET 9 SDK yükle
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.x'
      installationPath: $(Agent.ToolsDirectory)/dotnet

  # Restore
  - script: dotnet restore
    displayName: 'Restore dependencies'

  # Build
  - script: dotnet build --configuration $(buildConfiguration)
    displayName: 'Build project'

  # Publish
  - script: dotnet publish --configuration $(buildConfiguration) -o $(publishDir)
    displayName: 'Publish project'

  # Artifact indir (gerekirse)
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(publishDir)'
      ArtifactName: 'drop'
      publishLocation: 'Container'

  # Build artifact indir
  - task: DownloadBuildArtifacts@0
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'drop'
      downloadPath: '$(System.ArtifactsDirectory)'

  # SSH üzerinden dosyaları kopyala
  - task: CopyFilesOverSSH@0
    inputs:
      sshEndpoint: 'UbuntuServerVPN'   # Azure DevOps'ta tanımladığın Service Connection
      sourceFolder: '$(System.ArtifactsDirectory)/drop'
      contents: '**'
      targetFolder: '/var/www/Hems/api'

  # Servisi restart et
  - task: SSH@0
    inputs:
      sshEndpoint: 'UbuntuServerVPN'
      commands: |
        sudo systemctl daemon-reload
        sudo systemctl restart $(serviceName)
    displayName: 'Restart service on Ubuntu'