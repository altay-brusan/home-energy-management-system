trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: prod-config
- name: buildConfiguration
  value: 'Release'
- name: appSettings
  value: $[ variables['appsettings_json'] ]

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

- script: dotnet restore
  displayName: 'Restore'

- script: dotnet publish -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)
  displayName: 'Publish'

# Secret appsettings.json oluştur
- script: |
    echo "$(appSettings)" > $(Build.ArtifactStagingDirectory)/appsettings.json
  displayName: "Inject appsettings.json"

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'