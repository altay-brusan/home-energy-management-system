trigger:
  branches:
    include:
      - main   # main branch’e push olduğunda pipeline tetiklenecek

pool:
  name: 'Default'  # Self-hosted agent pool

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  appPath: '/var/www/Hems/api'        # Publish edilecek dizin
  serviceName: 'hems-api.service'     # systemd servisi

steps:
  # 1. Repo checkout
  - checkout: self

  # 2. .NET 9 SDK kullan
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.x'
      installationPath: $(Agent.ToolsDirectory)/dotnet

  # 3. Restore solution
  - script: |
      echo "Restoring solution..."
      dotnet restore "$(Build.SourcesDirectory)/Hems-Backend.sln"
    displayName: 'Restore solution'

  # 4. Build solution
  - script: |
      echo "Building solution..."
      dotnet build "$(Build.SourcesDirectory)/Hems-Backend.sln" --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  # 5. Publish solution (tüm web/API projeleri)
  - script: |
      echo "Publishing solution..."
      dotnet publish "$(Build.SourcesDirectory)/Hems-Backend.sln" --configuration $(buildConfiguration) -o "$(publishDir)" --no-build
    displayName: 'Publish solution'

  # 6. Deploy dosyaları hedef Ubuntu dizinine
  - script: |
      echo "Deploying files to $(appPath)..."
      mkdir -p "$(appPath)"
      if command -v rsync >/dev/null 2>&1; then
        rsync -av --delete "$(publishDir)/" "$(appPath)/"
      else
        rm -rf "$(appPath)/*"
        cp -r "$(publishDir)/*" "$(appPath)/"
      fi
    displayName: 'Deploy files to target folder'

  # 7. Systemd servisini restart et
  - script: |
      echo "Restarting systemd service $(serviceName)..."
      sudo systemctl daemon-reload
      sudo systemctl restart $(serviceName)
    displayName: 'Restart systemd service'