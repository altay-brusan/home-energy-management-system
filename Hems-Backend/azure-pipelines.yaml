trigger:
  branches:
    include:
      - main  # main branch’e push olduğunda pipeline tetiklenecek

pool:
  name: 'Default'  # Self-hosted agent pool adı

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  appPath: '/var/www/Hems/api'        # Publish edilecek dizin
  serviceName: 'hems-api.service'     # systemd servisi

steps:
  # Repo’yu checkout et
  - checkout: self

  # .NET 9 SDK kullan
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.x'
      installationPath: $(Agent.ToolsDirectory)/dotnet

  # Restore solution
  - script: dotnet restore $(Build.SourcesDirectory)/Hems-Backend.sln
    displayName: 'Restore solution'

  # Build solution
  - script: dotnet build $(Build.SourcesDirectory)/Hems-Backend.sln --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  # Publish solution
  - script: dotnet publish $(Build.SourcesDirectory)/Hems-Backend.sln --configuration $(buildConfiguration) -o $(publishDir) --no-build
    displayName: 'Publish solution'

  # Hedef klasöre deploy
  - script: |
      mkdir -p $(appPath)
      if command -v rsync >/dev/null 2>&1; then
        rsync -av --delete $(publishDir)/ $(appPath)/
      else
        rm -rf $(appPath)/*
        cp -r $(publishDir)/* $(appPath)/
      fi
    displayName: 'Deploy files to target folder'

  # Systemd servisini restart et
  - script: |
      sudo systemctl daemon-reload
      sudo systemctl restart $(serviceName)
    displayName: 'Restart systemd service'